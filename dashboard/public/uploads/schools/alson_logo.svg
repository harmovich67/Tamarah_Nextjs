  <path d="M100,110 C80,95 50,100 45,102 L45,65 C55,62 80,60 100,75 Z" fill="#ffffff" opacity="0.95"/>
  <path d="M100,110 C120,95 150,100 155,102 L155,65 C145,62 120,60 100,75 Z" fill="#ffffff" opacity="0.95"/>
