  <circle cx="80" cy="46" r="3.5" fill="#fbbf24"/>
  <circle cx="120" cy="46" r="3.5" fill="#fbbf24"/>
  <!-- Text -->
  <text x="100" y="140" font-family="'Cairo', sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">AL-ALSON</text>
  <text x="100" y="158" font-family="'Cairo', sans-serif" font-size="11" font-weight="700" fill="#fef08a" text-anchor="middle">الألسن الدولية</text>
